    <circle cx="1140" cy="80" r="1.5" fill="#EEE3B0" opacity="0.7"></circle>
    <defs>

  <p style="margin: 0; font-size: 30px; line-height: 1.5; color: rgba(238,227,176,0.88)">생년월일만 넣으면<br>매일 자정, 새로운 운세가 도착해요</p>
